name: Pages Deploy
# Veroeffentlicht eine statische Seite (Standard: Repo-Root, oder ./docs) auf GitHub Pages.
# Voraussetzung: Repo-Einstellungen > Pages > Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  SITE_DIR: .   # z. B. "docs", falls die Seite dort liegt
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Nur Seiteninhalt bereitstellen (ohne .git/.github)
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' "$SITE_DIR"/ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
